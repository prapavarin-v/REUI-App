name: reuni_app
description: REUNI - แอปขายของมือสองสำหรับนักศึกษา (Second Hand, New Stories)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase (ไม่ใช้ firebase_storage แล้ว — เปลี่ยนไปอัปโหลดรูปผ่าน Cloudinary แทน
  # เพื่อไม่ต้องผูกบัตรเครดิต/อัปเกรดเป็น Blaze plan ดู lib/services/storage_service.dart)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State management
  provider: ^6.1.2

  # UI helpers
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1

  # HTTP (สำหรับเรียก AI API ผ่าน Cloud Function / backend ของตัวเอง)
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
  - assets/images/

  # fonts:
  #   - family: Prompt
  #     fonts:
  #       - asset: assets/fonts/Prompt-Regular.ttf
  #       - asset: assets/fonts/Prompt-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Prompt-Bold.ttf
  #         weight: 700
